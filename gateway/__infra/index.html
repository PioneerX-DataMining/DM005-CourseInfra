<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CourseInfra Status</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; color: #172033; background: #f5f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(1120px, calc(100% - 32px)); margin: 0 auto; padding: 48px 0 72px; }
    .top { display: flex; justify-content: space-between; gap: 24px; align-items: flex-end; margin-bottom: 28px; }
    h1 { margin: 0; font-size: clamp(36px, 6vw, 60px); letter-spacing: -.04em; }
    .muted { color: #667085; }
    .grid { display: grid; gap: 14px; }
    .app { display: grid; grid-template-columns: 110px 1fr 180px 160px; gap: 18px; align-items: center; padding: 18px 20px; background: white; border: 1px solid #e4e7ec; border-radius: 18px; }
    .id { font-weight: 900; color: #155eef; }
    .name { font-size: 18px; font-weight: 800; }
    .repo { margin-top: 3px; font-size: 13px; color: #667085; overflow-wrap: anywhere; }
    .path { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
    .badges { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
    .badge { padding: 5px 8px; border-radius: 999px; background: #eef2f6; font-size: 12px; font-weight: 700; }
    .on { background: #dcfae6; color: #067647; }
    .warn { background: #fef0c7; color: #b54708; }
    footer { margin-top: 28px; color: #98a2b3; font-size: 13px; }
    @media (max-width: 760px) { .top { display:block; } .app { grid-template-columns: 72px 1fr; } .path, .badges { grid-column: 2; justify-content: flex-start; } }
  </style>
</head>
<body>
<main>
  <div class="top">
    <div><div class="muted">DM005 · COURSEINFRA</div><h1>Deployment Registry</h1></div>
    <div id="gateway" class="muted">Loading…</div>
  </div>
  <section id="apps" class="grid" aria-live="polite"></section>
  <footer id="generated"></footer>
</main>
<script>
(async () => {
  const res = await fetch('./apps.json', { cache: 'no-store' });
  const data = await res.json();
  document.querySelector('#gateway').textContent = `${data.gateway.domain} · ${data.gateway.project}`;
  document.querySelector('#generated').textContent = `Generated ${new Date(data.generatedAt).toLocaleString()}`;
  const root = document.querySelector('#apps');
  for (const app of data.apps) {
    const el = document.createElement('article');
    el.className = 'app';
    const flags = [
      `<span class="badge ${app.deployEnabled ? 'on' : 'warn'}">${app.deployEnabled ? 'Deploy ON' : 'Deploy OFF'}</span>`,
      `<span class="badge ${app.basePathReady ? 'on' : 'warn'}">${app.basePathReady ? 'Base Path OK' : 'Base Path TODO'}</span>`,
      `<span class="badge ${app.routeEnabled ? 'on' : ''}">${app.routeEnabled ? 'Routed' : 'Not Routed'}</span>`
    ].join('');
    el.innerHTML = `<div class="id">${app.id}</div><div><div class="name">${app.name}</div><div class="repo">${app.repo}</div></div><div class="path">${app.mount}</div><div class="badges">${flags}</div>`;
    root.appendChild(el);
  }
})().catch((error) => {
  document.querySelector('#apps').textContent = `Failed to load registry: ${error.message}`;
});
</script>
</body>
</html>
