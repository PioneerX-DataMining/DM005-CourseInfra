<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Data Mining Gateway</title>
  <style>
    :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f172a; color: #e2e8f0; }
    main { width: min(760px, calc(100% - 40px)); padding: 44px; border: 1px solid #334155; border-radius: 24px; background: #111827; box-shadow: 0 24px 80px rgba(0,0,0,.28); }
    .eyebrow { color: #7dd3fc; font-weight: 800; letter-spacing: .08em; font-size: 12px; }
    h1 { margin: 14px 0 12px; font-size: clamp(36px, 7vw, 64px); line-height: 1; }
    p { color: #94a3b8; font-size: 18px; line-height: 1.7; }
    a { color: #bae6fd; }
    code { color: #f8fafc; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">DM005 · COURSEINFRA</div>
    <h1>Gateway Ready</h1>
    <p>EdgeOne Gateway 已部署，但当前没有启用根路由。完成 DM001 的独立部署后，把生产域名写入 <code>config/apps.json</code> 并启用 <code>routeEnabled</code>，这里就会由课程主页接管。</p>
    <p><a href="/__infra/">查看 CourseInfra 状态页 →</a></p>
  </main>
</body>
</html>
