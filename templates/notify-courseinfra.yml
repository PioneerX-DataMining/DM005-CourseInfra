# Copy this file into a project repository as .github/workflows/notify-courseinfra.yml
# and replace DMXXX with the registered app id.
# Requires an organization/repository secret COURSEINFRA_DISPATCH_TOKEN that can
# trigger repository_dispatch on PioneerX-DataMining/DM005-CourseInfra.

name: Notify CourseInfra

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger central deployment
        env:
          GH_TOKEN: ${{ secrets.COURSEINFRA_DISPATCH_TOKEN }}
          APP_ID: DMXXX
        shell: bash
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "COURSEINFRA_DISPATCH_TOKEN is not configured." >&2
            exit 1
          fi
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/PioneerX-DataMining/DM005-CourseInfra/dispatches \
            -f event_type='courseinfra-deploy' \
            -F client_payload[app_id]="$APP_ID" \
            -F client_payload[environment]='production'
