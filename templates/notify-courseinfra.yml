# Copy this file into a project repository as .github/workflows/notify-courseinfra.yml
# and replace DMXXX with the registered app id.
# Requires an organization/repository secret COURSEINFRA_DISPATCH_TOKEN scoped to
# PioneerX-DataMining/DM005-CourseInfra with Actions: write permission only.

name: Notify CourseInfra

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check dispatch credential
        id: auth
        env:
          COURSEINFRA_DISPATCH_TOKEN: ${{ secrets.COURSEINFRA_DISPATCH_TOKEN }}
        shell: bash
        run: |
          if [[ -n "$COURSEINFRA_DISPATCH_TOKEN" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::COURSEINFRA_DISPATCH_TOKEN is not configured yet; automatic deployment notification is skipped."
          fi

      - name: Trigger central deployment
        if: steps.auth.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.COURSEINFRA_DISPATCH_TOKEN }}
          APP_ID: DMXXX
        shell: bash
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/PioneerX-DataMining/DM005-CourseInfra/actions/workflows/deploy-app.yml/dispatches \
            -f ref='main' \
            -F inputs[app_id]="$APP_ID" \
            -F inputs[environment]='production'
