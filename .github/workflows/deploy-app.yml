name: Emergency deploy registered app

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: Registered app id, for example DM001
        required: true
        type: string
      environment:
        description: EdgeOne environment
        required: true
        default: production
        type: choice
        options:
          - production
          - preview

permissions:
  contents: read

concurrency:
  group: emergency-edgeone-app-${{ inputs.app_id }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      EDGEONE_SITE: ${{ vars.EDGEONE_SITE || 'china' }}
    steps:
      - name: Checkout CourseInfra
        uses: actions/checkout@v4
        with:
          path: infra

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Load app configuration
        id: app
        run: node infra/scripts/get-app-config.mjs "${{ inputs.app_id }}"

      - name: Check private repository credential
        if: steps.app.outputs.private_repo == 'true'
        env:
          COURSEINFRA_REPO_TOKEN: ${{ secrets.COURSEINFRA_REPO_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$COURSEINFRA_REPO_TOKEN" ]]; then
            echo "${{ steps.app.outputs.repo }} is private. Configure COURSEINFRA_REPO_TOKEN for emergency deployment." >&2
            exit 1
          fi

      - name: Checkout app source
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.app.outputs.repo }}
          ref: ${{ steps.app.outputs.branch }}
          path: source
          token: ${{ secrets.COURSEINFRA_REPO_TOKEN || github.token }}

      - name: Install app dependencies
        if: steps.app.outputs.install != ''
        working-directory: source
        shell: bash
        run: ${{ steps.app.outputs.install }}

      - name: Build app
        if: steps.app.outputs.build != ''
        working-directory: source
        shell: bash
        run: ${{ steps.app.outputs.build }}

      - name: Prepare clean deployment artifact
        run: node infra/scripts/prepare-artifact.mjs source "${{ steps.app.outputs.output }}" artifact

      - name: Install EdgeOne CLI
        run: npm install -g edgeone

      - name: Check EdgeOne credential
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$EDGEONE_API_TOKEN" ]]; then
            echo "Configure EDGEONE_API_TOKEN in CourseInfra secrets before emergency deployment." >&2
            exit 1
          fi

      - name: Deploy to EdgeOne Makers
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          PROJECT_NAME: ${{ steps.app.outputs.project }}
          TARGET_ENV: ${{ inputs.environment }}
        shell: bash
        run: |
          edgeone makers deploy artifact \
            -n "$PROJECT_NAME" \
            -t "$EDGEONE_API_TOKEN" \
            -e "$TARGET_ENV" \
            --site "$EDGEONE_SITE"

      - name: Deployment summary
        shell: bash
        run: |
          {
            echo "### Emergency CourseInfra deployment"
            echo "Normal production delivery uses EdgeOne Git Auto Deploy."
            echo "- App: ${{ steps.app.outputs.id }}"
            echo "- Repository: ${{ steps.app.outputs.repo }}"
            echo "- EdgeOne project: ${{ steps.app.outputs.project }}"
            echo "- Environment: ${{ inputs.environment }}"
          } >> "$GITHUB_STEP_SUMMARY"
