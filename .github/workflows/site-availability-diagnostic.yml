name: Course site availability diagnostic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/site-availability-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve course-site DNS
        shell: bash
        run: |
          echo "=== system resolution ==="
          getent ahostsv4 dm.pioneer-x.cn || true
          echo "=== Cloudflare resolver ==="
          dig +time=3 +tries=1 @1.1.1.1 dm.pioneer-x.cn A || true
          echo "=== Google resolver ==="
          dig +time=3 +tries=1 @8.8.8.8 dm.pioneer-x.cn A || true
      - name: Probe pages and report HTTP status
        shell: bash
        run: |
          for path in / /curriculum.html /concepts/feature-scaling.html /__infra/apps.json /api/course-webhook; do
            echo "=== https://dm.pioneer-x.cn$path ==="
            curl -L -sS --connect-timeout 6 --max-time 12 -o /tmp/course-http-body -D /tmp/course-http-headers -w 'HTTP=%{http_code} DNS=%{time_namelookup} connect=%{time_connect} TLS=%{time_appconnect} total=%{time_total} IP=%{remote_ip}\n' "https://dm.pioneer-x.cn$path?diag=${GITHUB_RUN_ID}" || true
            head -n 12 /tmp/course-http-headers 2>/dev/null || true
            head -c 200 /tmp/course-http-body 2>/dev/null | tr '\n' ' '; echo
          done

      - name: Check Makers project deployments and preview reachability
        shell: bash
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: |
          npm install --no-audit --no-fund
          node --input-type=module <<'JS'
          import { Makers } from '@edgeone/makers-sdk';
          const makers = new Makers({token: process.env.EDGEONE_API_TOKEN, region:'china', timeout:12, retries:1});
          const projectId='makers-ssul1zh8kx7t';
          try {
            const ps=await makers.projects.list({name:'dm-course-gateway',page:0,pageSize:20});
            for (const p of ps.items) {
              if (p.projectId===projectId) {
                console.log('Project metadata:',JSON.stringify({projectId:p.projectId,name:p.name,status:p.status,domain:p.domain,site:p.site,productionUrl:p.productionUrl}));
              }
            }
          } catch(e) {console.log('Project list error',e?.message);}
          const list=await makers.deployments.list({projectId,page:0,pageSize:8,order:{field:'createdOn',direction:'desc'}});
          for(const v of list.items) {
            console.log('Deployment:',JSON.stringify({deploymentId:v.deploymentId,env:v.env,status:v.status,createdOn:v.createdOn,modifiedOn:v.modifiedOn,previewHost:v.previewUrl?new URL(v.previewUrl).host:null}));
            if(v.previewUrl){
              try{
                const url=new URL(v.previewUrl);url.pathname='/';const res=await fetch(url,{redirect:'follow',signal:AbortSignal.timeout(9000)});
                console.log('Preview HTTP',v.deploymentId,res.status,res.headers.get('server'));
              }catch(e){console.log('Preview fetch error',v.deploymentId,e.message);}
            }
          }

          try {
            const project=await makers.projects.get({projectId});
            console.log('Project domain info:',JSON.stringify({area:project.area,presetDomain:project.presetDomain,status:project.status}));
            if(project.presetDomain){
              try {
                const domainUrl=new URL('https://'+project.presetDomain+'/');
                const response=await fetch(domainUrl,{signal:AbortSignal.timeout(9000)});
                console.log('Project domain HTTP',response.status,response.headers.get('server'));
              }catch(e){console.log('Project domain error',e.message)}
            }
          }catch(e){console.log('Project get failed',e.message);}
          try{
            const res=await fetch('https://pages-api.cloud.tencent.com/v1',{method:'POST',headers:{'Authorization':'Bearer '+process.env.EDGEONE_API_TOKEN,'Content-Type':'application/json'},body:JSON.stringify({Action:'DescribePagesZoneCustomDomains',ProjectId:projectId}),signal:AbortSignal.timeout(12000)});
            const j=await res.json();
            const data=j.Data?.Response||j.Response||j;
            console.log('Custom domain API:',JSON.stringify({http:res.status,code:j.Code,message:j.Message,total:data.TotalCount,domains:(data.PagesDomains||data.Domains||[]).filter(d=>d.Domain==='dm.pioneer-x.cn').map(d=>({domain:d.Domain,status:d.Status,cname:d.Cname,currentCname:d.CurrentCname,mainDomain:d.MainDomain,area:d.Area,type:d.Type,zoneId:d.ZoneId}))}));
          }catch(e){console.log('Custom domain API error:',e.message);}

          try {
            const preview=await makers.deployments.wait({projectId,deploymentId:'dp0bsniau4lc',timeout:35,pollInterval:3});
            if(preview.previewUrl){
              const u=new URL(preview.previewUrl);
              const response=await fetch(u,{signal:AbortSignal.timeout(9000)});
              const body=await response.text();
              console.log('Signed preview availability:',JSON.stringify({status:response.status,containsCourseHub:body.includes('DM001'),host:u.host,hasSignedQuery:u.searchParams.has('eo_token')}));
              if(response.ok&&body.includes('DM001'))console.log('TEMPORARY_COURSE_PREVIEW_URL='+preview.previewUrl);
            }
          }catch(e){console.log('Signed preview error',e.message)}
          JS
