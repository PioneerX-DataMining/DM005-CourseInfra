name: Course site availability diagnostic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/site-availability-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve course-site DNS
        shell: bash
        run: |
          echo "=== system resolution ==="
          getent ahostsv4 dm.pioneer-x.cn || true
          echo "=== Cloudflare resolver ==="
          dig +time=3 +tries=1 @1.1.1.1 dm.pioneer-x.cn A || true
          echo "=== Google resolver ==="
          dig +time=3 +tries=1 @8.8.8.8 dm.pioneer-x.cn A || true
      - name: Probe pages and report HTTP status
        shell: bash
        run: |
          for path in / /curriculum.html /concepts/feature-scaling.html /__infra/apps.json /api/course-webhook; do
            echo "=== https://dm.pioneer-x.cn$path ==="
            curl -L -sS --connect-timeout 6 --max-time 12 -o /tmp/course-http-body -D /tmp/course-http-headers -w 'HTTP=%{http_code} DNS=%{time_namelookup} connect=%{time_connect} TLS=%{time_appconnect} total=%{time_total} IP=%{remote_ip}\n' "https://dm.pioneer-x.cn$path?diag=${GITHUB_RUN_ID}" || true
            head -n 12 /tmp/course-http-headers 2>/dev/null || true
            head -c 200 /tmp/course-http-body 2>/dev/null | tr '\n' ' '; echo
          done

      - name: Check Makers project deployments and preview reachability
        shell: bash
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: |
          npm install --no-audit --no-fund
          node --input-type=module <<'JS'
          import { Makers } from '@edgeone/makers-sdk';
          const makers = new Makers({token: process.env.EDGEONE_API_TOKEN, region:'china', timeout:12, retries:1});
          const projectId='makers-ssul1zh8kx7t';
          try {
            const ps=await makers.projects.list({name:'dm-course-gateway',page:0,pageSize:20});
            for (const p of ps.items) {
              if (p.projectId===projectId) {
                console.log('Project metadata:',JSON.stringify({projectId:p.projectId,name:p.name,status:p.status,domain:p.domain,site:p.site,productionUrl:p.productionUrl}));
              }
            }
          } catch(e) {console.log('Project list error',e?.message);}
          const list=await makers.deployments.list({projectId,page:0,pageSize:8,order:{field:'createdOn',direction:'desc'}});
          for(const v of list.items) {
            console.log('Deployment:',JSON.stringify({deploymentId:v.deploymentId,env:v.env,status:v.status,createdOn:v.createdOn,modifiedOn:v.modifiedOn,previewHost:v.previewUrl?new URL(v.previewUrl).host:null}));
            if(v.previewUrl){
              try{
                const url=new URL(v.previewUrl);url.pathname='/';const res=await fetch(url,{redirect:'follow',signal:AbortSignal.timeout(9000)});
                console.log('Preview HTTP',v.deploymentId,res.status,res.headers.get('server'));
              }catch(e){console.log('Preview fetch error',v.deploymentId,e.message);}
            }
          }
          JS
