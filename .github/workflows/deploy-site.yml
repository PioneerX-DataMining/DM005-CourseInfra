name: Deploy course site to EdgeOne

on:
  repository_dispatch:
    types: [course-source-push]
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'config/apps.json'
      - 'edge-functions/**'
      - 'scripts/deploy-site.mjs'
      - 'scripts/validate-registry.mjs'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dm-course-central-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest CourseInfra main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate registry
        run: node scripts/validate-registry.mjs

      - name: Install EdgeOne CLI
        shell: bash
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "Installing EdgeOne CLI (attempt $attempt/3)..."
            if npm install -g edgeone; then
              edgeone --version || true
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "EdgeOne CLI installation failed after 3 attempts."
              exit 1
            fi
            npm uninstall -g edgeone || true
            sleep $((attempt * 3))
          done

      - name: Deploy changed course site
        shell: bash
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          COURSEINFRA_REPO_TOKEN: ${{ secrets.COURSEINFRA_REPO_TOKEN }}
          FORCE_DEPLOY: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'true' || 'false' }}
          TRIGGER_REPOSITORY: ${{ github.event.client_payload.repository || '' }}
          TRIGGER_REVISION: ${{ github.event.client_payload.after || '' }}
        run: |
          if [[ -n "$TRIGGER_REPOSITORY" ]]; then
            echo "Webhook trigger: $TRIGGER_REPOSITORY ${TRIGGER_REVISION:0:12}"
          fi

          for attempt in 1 2 3; do
            echo "Deploy attempt $attempt/3..."
            if timeout --kill-after=30s 5m node scripts/deploy-site.mjs; then
              exit 0
            fi

            if [[ "$attempt" -eq 3 ]]; then
              echo "EdgeOne deployment failed after 3 attempts."
              exit 1
            fi

            wait_seconds=$((attempt * 10))
            echo "Transient deployment failure; retrying in ${wait_seconds}s..."
            sleep "$wait_seconds"
          done

      - name: Record successful source revisions
        shell: bash
        run: |
          if git diff --quiet -- state/deployments.json; then
            echo "Deployment state unchanged."
            exit 0
          fi

          # Preserve the state produced by the deployment, then move the
          # working tree onto the latest main before committing it. This
          # avoids non-fast-forward failures when queued runs started from
          # an older event SHA.
          state_tmp="$(mktemp)"
          cp state/deployments.json "$state_tmp"
          git fetch origin main
          git reset --hard origin/main
          cp "$state_tmp" state/deployments.json
          rm -f "$state_tmp"

          if git diff --quiet -- state/deployments.json; then
            echo "Latest main already records this deployment state."
            exit 0
          fi

          git config user.name "DM CourseInfra Bot"
          git config user.email "courseinfra-bot@users.noreply.github.com"
          git add state/deployments.json
          git commit -m "chore: record deployed revisions [skip ci]"
          git push origin HEAD:main
