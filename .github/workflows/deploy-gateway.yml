name: Deploy gateway

on:
  workflow_dispatch:
    inputs:
      environment:
        description: EdgeOne environment
        required: true
        default: production
        type: choice
        options:
          - production
          - preview

permissions:
  contents: read

concurrency:
  group: edgeone-course-gateway
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      EDGEONE_SITE: ${{ vars.EDGEONE_SITE || 'china' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate and render Gateway
        run: npm run check

      - name: Install EdgeOne CLI
        run: npm install -g edgeone

      - name: Check EdgeOne credential
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$EDGEONE_API_TOKEN" ]]; then
            echo "Configure EDGEONE_API_TOKEN in CourseInfra secrets before deploying." >&2
            exit 1
          fi

      - name: Deploy Gateway to EdgeOne Makers
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          TARGET_ENV: ${{ inputs.environment }}
        shell: bash
        run: |
          edgeone makers deploy gateway \
            -n dm-course-gateway \
            -t "$EDGEONE_API_TOKEN" \
            -e "$TARGET_ENV" \
            --site "$EDGEONE_SITE"

      - name: Deployment summary
        shell: bash
        run: |
          {
            echo "### DM Course Gateway"
            echo "- EdgeOne project: dm-course-gateway"
            echo "- Intended custom domain: dm.pioneer-x.cn"
            echo "- Environment: ${{ inputs.environment }}"
            echo ""
            echo "Validate the EdgeOne preset domain first. Bind dm.pioneer-x.cn only after the routes work as expected."
          } >> "$GITHUB_STEP_SUMMARY"
